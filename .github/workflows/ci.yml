name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs are cancelled so a fast follow-up push does not wait behind
# a stale run of the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate pack manifests (structure + trust ladder)
        run: python tools/validate-packs.py
      - name: Check ID cross-references (FR/BR/AC/CTL/NFR/ADR)
        run: python tools/check-ids.py
      - name: Check relative Markdown links
        run: python tools/check-links.py
      - name: Build the static site (fails on broken internal links)
        run: python tools/build-site.py
      - name: Tooling tests (with coverage)
        run: >-
          python -m pytest tests/ -q
          --cov=tools --cov-report=term-missing --cov-fail-under=75

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Install from requirements-dev.txt rather than a floating range: a
      # newer ruff adds rules to the families selected in pyproject.toml, so
      # "works locally, red in CI" is otherwise guaranteed to happen.
      - name: Install dependencies (ruff pinned)
        run: pip install -r requirements-dev.txt
      - name: ruff check (lint + import order)
        run: ruff check . --output-format=github

  compat:
    name: Compatibility (${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Build the site (renders under this Python version)
        run: python tools/build-site.py --out _compat_site --site-url=
      - name: Tooling tests
        run: python -m pytest tests/ -q

  schema:
    name: Schema is valid JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse pack-manifest schema
        run: python -c "import json; json.load(open('schemas/pack-manifest.schema.json')); print('schema OK')"

  external-links:
    name: External citation links (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Probe cited external URLs (HEAD; informational)
        run: python tools/check-links.py --check-external --timeout 8
