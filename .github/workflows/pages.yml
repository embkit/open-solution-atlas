name: Deploy site

# Builds the static catalog and publishes it to GitHub Pages.
# The site is generated from the packs themselves — no committed build output.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build site (fails on broken internal links)
        run: python tools/build-site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # v4 changed the default to EXCLUDE dotfiles; v5 only added an opt-in
          # input. This site emits `.nojekyll`, which GitHub Pages needs to
          # skip its Jekyll build — the vendored libraries and generated
          # catalog must be served verbatim. Without this input the v3 -> v5
          # bump silently drops `.nojekyll` from the deployed artifact.
          # (.git and .github are excluded by the action regardless, so the
          # only file this adds back is `.nojekyll`.)
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
