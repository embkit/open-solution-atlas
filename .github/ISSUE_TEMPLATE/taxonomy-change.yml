name: 🗂️ Taxonomy / standard change
description: Propose a new subdomain or a change to the Pack Standard
title: "[Taxonomy/Standard] "
labels: ["taxonomy", "standard"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What to add/change, and why.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Boundary definition
      description: For a new subdomain: ≥2 distinct real-world systems that fit, and how it differs from neighboring subdomains.
    validations:
      required: true
  - type: textarea
    id: affected
    attributes:
      label: Affected packs / PRs
